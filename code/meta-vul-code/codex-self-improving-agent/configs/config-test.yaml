model:
  name: "gpt-5.4"
  backend: "codex-cli"
  reasoning_effort: "high"

decoding:
  temperature: 0
  top_p: 1.0
  max_tokens: 4096

dataset:
  name: "primevul_paired_test"
  path: "../../data/primevul/test_with_vul_lines_uuid.jsonl"
  code_field: "func"
  label_field: "target"
  id_field: "cve"

policies:
  - scot
  - mot
  - tot

prompts_dir: "prompts/"
outputs_dir: "outputs/"

agentic:
  enabled: true

isolation:
  permission_profile: "benchmark_readonly"

runner:
  timeout_s: 1800  # 30 min per call (was 900; long GLM-5.3 / DeepSeek calls hit the limit)
  retries: 3
  retry_delay_s: 1.0
  concurrency: 1
  skip_existing: true
