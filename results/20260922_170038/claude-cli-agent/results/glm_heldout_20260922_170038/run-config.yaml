model:
  name: z-ai/glm-5.3
  backend: claude-cli
  provider: openrouter
decoding:
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
dataset:
  name: primevul_paired_test
  path: ../../data/primevul/test_with_vul_lines_uuid.jsonl
  code_field: func
  label_field: target
  id_field: cve
prompts_dir: prompts/
outputs_dir: outputs/
agentic:
  enabled: true
runner:
  timeout_s: 900
  retries: 3
  retry_delay_s: 1.0
  concurrency: 60
  skip_existing: true
