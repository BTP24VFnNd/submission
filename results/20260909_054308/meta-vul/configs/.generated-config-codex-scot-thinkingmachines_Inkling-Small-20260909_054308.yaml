model:
  name: thinkingmachines/Inkling-Small
  backend: codex-cli
  reasoning_effort: high
  provider: tinker
optimizer_model:
  name: claude-opus-4-6
  backend: claude-cli
decoding:
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
dataset:
  name: titanvul_cweval_optimization_val
  path: ../../data/titanvul_cweval_optimization_val_uuid.jsonl
  code_field: func
  label_field: target
  id_field: cve
optimization:
  max_iterations: 15
  target_metric: pairwise_accuracy
  patience: 4
  failure_sample_size: 10
  seed_prompt: prompts/iterations/iter_000_scot.txt
prompts_dir: prompts/
outputs_dir: outputs/
agentic:
  enabled: true
runner:
  timeout_s: 900
  retries: 3
  retry_delay_s: 1.0
  concurrency: 30
  skip_existing: true
agent_dir: codex-self-improving-agent
